# /apphosting.production.yaml
# This file should be named to match the environment name you set in the Firebase Console
# (e.g., if you named it "production", this file should be "apphosting.production.yaml").

env:
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: "community-80928" # CONFIRM THIS IS YOUR CORRECT FIREBASE PROJECT ID
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: "firebase-adminsdk-fbsvc@community-80928.iam.gserviceaccount.com" # Replace with the client_email from your Firebase service account JSON key
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: firebase-admin-private-key # This is the ID of the secret you created in Google Secret Manager (e.g., firebase-admin-private-key)
    availability:
      - BUILD
      - RUNTIME

  # NEXT_PUBLIC_ variables are safe to be here as they are meant to be public.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCA5vfVssd70Zx9lBPwp3fvTEo8iIeWI6o" # Replace with your actual API key
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "community-80928.firebaseapp.com" # CONFIRM THIS
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "community-80928" # CONFIRM THIS
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "community-80928.appspot.com" # Replace with your actual storage bucket if different
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "334048805094" # Replace with your actual Messaging Sender ID
    availability:
      - BUILD
      - RUNTIME
  - variable: YOUR_NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:334048805094:web:47283320973e3b635c3b27" # Replace with your actual App ID
    availability:
      - BUILD
      - RUNTIME
  # - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID # Uncomment and replace if you use Measurement ID
  #   value: "G-LQK31G92E5"
  #   availability:
  #     - BUILD
  #     - RUNTIME

# You can also include other settings from your main apphosting.yaml if they need to be
# overridden for this specific environment. For example:
# runConfig:
#   maxInstances: 2
