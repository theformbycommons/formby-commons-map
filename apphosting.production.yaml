# /apphosting.production.yaml
# This file should be named to match the environment name you set in the Firebase Console
# (e.g., if you named your environment "production", this file should be "apphosting.production.yaml").

env:
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: "act-local-glow"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: "firebase-adminsdk-fbsvc@act-local-glow.iam.gserviceaccount.com" # Updated from your JSON
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: act-local-glow-cloud-google-secret # This should be the ID/name of the secret you created in Google Secret Manager
    availability:
      - BUILD
      - RUNTIME

  # NEXT_PUBLIC_ variables are safe to be here as their values are meant to be public.
  # Ensure these match your Firebase project configuration.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCfeC-ZrvvWe1nSj-PZCr4nKVL8Q8_oY9M"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
