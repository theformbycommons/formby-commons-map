# /apphosting.production.yaml
# This file should be named to match the environment name you set in the Firebase Console
# (e.g., if you named your environment "production", this file should be "apphosting.production.yaml").

env:
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: "community-80928" 
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: "YOUR_SERVICE_ACCOUNT_CLIENT_EMAIL" # Replace with the client_email from your Firebase service account JSON key
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: firebase-admin-private-key # This should be the ID/name of the secret you created in Google Secret Manager (e.g., "firebase-admin-private-key")
    availability:
      - BUILD
      - RUNTIME

  # NEXT_PUBLIC_ variables are safe to be here as their values are meant to be public.
  # Ensure these match your Firebase project configuration.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AlzaSyCA5vfVssd70Zx9lBPwp3fvTEo8ileWI60"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "community-80928.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "community-80928"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "community-80928.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "334048805094"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:334048805094:web:47283320973e3b635c3b27"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-LQK31G92E5"
    availability:
      - BUILD
